<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vizuální reprezentace Babylonské knihovny (interaktivní)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        .grid-dynamic {
            display: grid;
            width: 100%;
            height: 100%;
            aspect-ratio: 1 / 1;
            border: 1px solid #4A5568;
            border-radius: 0.25rem;
            overflow: hidden;
            transition: border-color 0.2s ease-in-out, box-shadow 0.2s ease-in-out;
        }
        .grid-3 { grid-template-columns: repeat(3, 1fr); grid-template-rows: repeat(3, 1fr); }
        .grid-4 { grid-template-columns: repeat(4, 1fr); grid-template-rows: repeat(4, 1fr); }
        
        .cell-black { background-color: #1A202C; }
        .cell-white {
            background-color: #F7FAFC;
            box-shadow: inset 0 0 0 1px #E2E8F0;
        }
        .search-cell { cursor: pointer; transition: background-color 0.2s ease-in-out; }
        .highlighted {
            border: 3px solid #E53E3E;
            box-shadow: 0 0 10px rgba(229, 62, 62, 0.7);
        }
        .progress-bar {
            transition: width 0.2s ease-out;
        }
        /* --- PERFORMANCE OPTIMIZATION --- */
        #library-container > .grid-dynamic {
            content-visibility: auto;
            contain-intrinsic-size: 40px; 
        }
    </style>
</head>
<body class="bg-gray-100 dark:bg-gray-900 text-gray-800 dark:text-gray-200">

    <div class="container mx-auto p-4 md:p-8">
        <header class="text-center mb-8">
            <h1 class="text-3xl md:text-5xl font-bold mb-2">Babylonská knihovna</h1>
            <p id="subtitle" class="text-md md:text-lg text-gray-600 dark:text-gray-400"></p>
        </header>

        <!-- Controls Section -->
        <section class="mb-8 flex flex-col sm:flex-row justify-center items-center gap-4">
            <div class="flex items-center gap-2">
                <span class="font-semibold">Velikost mřížky:</span>
                <button id="btn-3x3" class="px-4 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition">3x3</button>
                <button id="btn-4x4" class="px-4 py-2 bg-gray-500 text-white rounded-md hover:bg-gray-600 transition">4x4</button>
            </div>
        </section>

        <!-- Search Section -->
        <section class="mb-10 p-6 bg-white dark:bg-gray-800 rounded-lg shadow-md max-w-sm mx-auto flex flex-col items-center gap-4">
            <h2 class="text-xl font-bold text-center">Vyhledat vzor</h2>
            <div id="search-grid-container" class="w-48 h-48">
                <!-- Interactive search grid will be generated here -->
            </div>
            <div class="flex gap-4 mt-2">
                <button id="search-jump-btn" title="Najít a přeskočit" class="p-3 bg-green-600 text-white rounded-full hover:bg-green-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-5.197-5.197m0 0A7.5 7.5 0 105.196 5.196a7.5 7.5 0 0010.607 10.607z" />
                    </svg>
                </button>
                <button id="clear-btn" title="Vymazat výběr" class="p-3 bg-red-600 text-white rounded-full hover:bg-red-700 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-6 h-6">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" />
                    </svg>
                </button>
            </div>
        </section>

        <!-- Loading Indicator -->
        <div id="loading-indicator" class="text-center my-10 hidden">
            <p class="text-lg">Generuji knihovnu, prosím čekejte...</p>
            <div class="w-full max-w-md mx-auto bg-gray-200 rounded-full h-2.5 dark:bg-gray-700 mt-2">
                <div id="progress-bar" class="bg-blue-600 h-2.5 rounded-full progress-bar" style="width: 0%"></div>
            </div>
            <p id="progress-text" class="text-sm text-gray-500 mt-1">0%</p>
        </div>

        <!-- Container for all the generated grids -->
        <main id="library-container" class="gap-2 md:gap-3 hidden">
            <!-- Grids will be generated by JavaScript and inserted here -->
        </main>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const libraryContainer = document.getElementById('library-container');
            const searchGridContainer = document.getElementById('search-grid-container');
            const loadingIndicator = document.getElementById('loading-indicator');
            const progressBar = document.getElementById('progress-bar');
            const progressText = document.getElementById('progress-text');
            const subtitle = document.getElementById('subtitle');
            const searchJumpBtn = document.getElementById('search-jump-btn');
            const clearBtn = document.getElementById('clear-btn');
            const btn3x3 = document.getElementById('btn-3x3');
            const btn4x4 = document.getElementById('btn-4x4');

            let currentSize = 0;

            function clearLibrary() {
                libraryContainer.innerHTML = '';
                searchGridContainer.innerHTML = '';
                libraryContainer.className = 'hidden';
            }

            function init(size) {
                if (currentSize === size) return;
                currentSize = size;
                clearLibrary();

                btn3x3.classList.toggle('bg-blue-600', size === 3);
                btn3x3.classList.toggle('bg-gray-500', size !== 3);
                btn4x4.classList.toggle('bg-blue-600', size === 4);
                btn4x4.classList.toggle('bg-gray-500', size !== 4);

                const cellsCount = size * size;
                const totalCombinations = Math.pow(2, cellsCount);
                
                subtitle.textContent = `Vizuální reprezentace všech ${totalCombinations.toLocaleString('cs-CZ')} unikátních kombinací v mřížce ${size}x${size}.`;
                
                generateSearchGrid(size);
                generateLibrary(size, cellsCount, totalCombinations);
            }

            function generateLibrary(size, cellsCount, totalCombinations) {
                loadingIndicator.style.display = 'block';
                libraryContainer.style.display = 'none';

                let i = 0;
                const batchSize = size === 3 ? 512 : 1024;

                function generateBatch() {
                    const fragment = document.createDocumentFragment();
                    const limit = Math.min(i + batchSize, totalCombinations);
                    for (; i < limit; i++) {
                        const binaryString = i.toString(2).padStart(cellsCount, '0');
                        const gridWrapper = document.createElement('div');
                        gridWrapper.className = `grid-dynamic grid-${size}`;
                        gridWrapper.dataset.binary = binaryString;

                        for (let j = 0; j < cellsCount; j++) {
                            const cell = document.createElement('div');
                            cell.className = binaryString[j] === '1' ? 'cell-black' : 'cell-white';
                            gridWrapper.appendChild(cell);
                        }
                        fragment.appendChild(gridWrapper);
                    }
                    libraryContainer.appendChild(fragment);

                    const percent = Math.round((i / totalCombinations) * 100);
                    progressBar.style.width = `${percent}%`;
                    progressText.textContent = `${percent}%`;

                    if (i < totalCombinations) {
                        setTimeout(generateBatch, 0);
                    } else {
                        loadingIndicator.style.display = 'none';
                        libraryContainer.style.display = 'grid';
                        libraryContainer.className = `grid gap-2 md:gap-3 grid-cols-8 sm:grid-cols-12 md:grid-cols-16 lg:grid-cols-20 xl:grid-cols-24`;
                    }
                }
                generateBatch();
            }

            function generateSearchGrid(size) {
                const searchGrid = document.createElement('div');
                searchGrid.className = `grid-dynamic grid-${size}`;
                searchGrid.id = 'search-grid';

                for (let i = 0; i < size * size; i++) {
                    const cell = document.createElement('div');
                    cell.className = 'cell-white search-cell';
                    cell.addEventListener('click', handleSearchCellClick);
                    searchGrid.appendChild(cell);
                }
                searchGridContainer.appendChild(searchGrid);
            }

            function handleSearchCellClick(event) {
                const cell = event.target;
                cell.classList.toggle('cell-white');
                cell.classList.toggle('cell-black');
            }

            function searchAndJump() {
                if (loadingIndicator.style.display === 'block') return;

                const searchCells = document.querySelectorAll('#search-grid .search-cell');
                let searchBinaryString = '';
                
                searchCells.forEach(cell => {
                    searchBinaryString += cell.classList.contains('cell-black') ? '1' : '0';
                });

                const previouslyHighlighted = document.querySelector('.highlighted');
                if (previouslyHighlighted) {
                    previouslyHighlighted.classList.remove('highlighted');
                }

                const targetGrid = document.querySelector(`.grid-dynamic[data-binary="${searchBinaryString}"]`);
                if (targetGrid) {
                    targetGrid.classList.add('highlighted');
                    targetGrid.scrollIntoView({ behavior: 'smooth', block: 'center' });
                }
            }
            
            function clearSelection() {
                const searchCells = document.querySelectorAll('#search-grid .search-cell');
                searchCells.forEach(cell => {
                    cell.className = 'cell-white search-cell';
                });
                
                const previouslyHighlighted = document.querySelector('.highlighted');
                if (previouslyHighlighted) {
                    previouslyHighlighted.classList.remove('highlighted');
                }
            }

            btn3x3.addEventListener('click', () => init(3));
            btn4x4.addEventListener('click', () => init(4));
            searchJumpBtn.addEventListener('click', searchAndJump);
            clearBtn.addEventListener('click', clearSelection);

            // Initial load with 3x3 grid
            init(3);
        });
    </script>

</body>
</html>
